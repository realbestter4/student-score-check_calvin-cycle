    function checkResult() {
      const id = document.getElementById("studentId").value.trim();
      const resultDiv = document.getElementById("result");

      if (!id) {
        resultDiv.innerHTML = "<span class='text-red-500'>กรุณากรอกเลขประจำตัว</span>";
        return;
      }

      if (results[id]) {
        const r = results[id];
        const scoreText = r.score === null ? "-" : r.score;
        const color = r.status === "ผ่าน" ? "text-green-600" : r.status === "ขาดสอบ" ? "text-yellow-600" : "text-red-600";
        resultDiv.innerHTML = `ชื่อ: <b>${r.name}</b><br>ผลสอบ: <span class='font-bold ${color}'>${r.status}</span><br>คะแนน: <b>${scoreText}</b>`;
      } else {
        resultDiv.innerHTML = "<span class='text-red-500'>ไม่พบข้อมูล</span>";
      }
    }

    // แสดงรายชื่อนักเรียนทั้งหมด
    const listEl = document.getElementById("studentList");
    Object.values(results).forEach(s => {
      const li = document.createElement("li");
      li.textContent = s.name;
      listEl.appendChild(li);
    });
  </script>
